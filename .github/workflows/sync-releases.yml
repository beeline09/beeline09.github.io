name: Sync Darktec releases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,18 * * *"
  repository_dispatch:
    types: [meshcore-release]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages site
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate darktec/releases.json
        env:
          FIRMWARE_REPO: beeline09/MeshCore
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-releases.mjs

      - name: Mirror UF2s to darktec/firmware/latest
        env:
          FIRMWARE_REPO: beeline09/MeshCore
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || '' }}
        run: python3 scripts/mirror-firmware.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add darktec/releases.json darktec/firmware/latest
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(darktec): sync releases + mirror UF2 for online flasher"
          # Pages deploy / concurrent syncs can advance main; rebase then push.
          git pull --rebase origin main
          git push
