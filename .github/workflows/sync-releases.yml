name: Sync Darktec releases

on:
  workflow_dispatch:
  schedule:
    # Refresh manifest twice a day in case MeshCore releases were published manually.
    - cron: "17 6,18 * * *"
  repository_dispatch:
    types: [meshcore-release]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages site
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate darktec/releases.json
        env:
          FIRMWARE_REPO: beeline09/MeshCore
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-releases.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add darktec/releases.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(darktec): sync releases.json from MeshCore"
          git push
